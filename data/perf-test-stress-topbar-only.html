<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stress A — TopBar Only</title>
</head>
<body>
  <header class="top-bar app-top-bar">
    <div class="brand-title">Ops Console</div>
    <nav class="top-bar-actions">
      <button type="button" class="btn" data-action="sync">Sync now</button>
      <button type="button" class="btn" data-action="Generate_Report">generate report (again)</button>
      <button type="button" class="btn" data-action="clear_queue">Clear queue</button>
      <button type="button" class="btn" data-action="save_postmortem">Save &amp; Continue</button>
      <button type="button" class="btn" data-action="silence_alerts">Silence 15m</button>
      <button type="button" class="btn" data-action="confirm_close">Yes, close</button>
    </nav>
  </header>
</body>
</html>
